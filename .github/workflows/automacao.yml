name: Robo do Mercado Livre

on:
  schedule:
    # Roda todo dia às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: # Botão para testar manualmente

jobs:
  raspagem_dados:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v3

    - name: Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar as bibliotecas
      run: |
        pip install -r requirements.txt

    - name: Ligar o motor do robô
      run: python scraper_selenium.py

    - name: Salvar o banco de dados no repositório
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add historico_precos.db
        git commit -m "Banco atualizado automaticamente" || echo "Nenhuma mudança nos dados hoje"
        git push